name: CI Infra Monitor   

on: 

  push: 

    branches: [main] 

  pull_request:   

jobs: 

  validar: 

    name: Validar toolkit 

    runs-on: ubuntu-latest 

    steps: 

      - uses: actions/checkout@v6   

      - uses: actions/setup-node@v6 

        with: 

          node-version: 20
          cache: npm
                
      - run: npm ci   

      - run: npm test

      - name: Mostrar variable secreta
        env:  
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: echo "Clave:" $ MONITOR_API_KEY