name: Pruebas en Pull Request
 
on:
  pull_request:
    branches: [main]
 
jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
 
  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: compilar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
 
  desplegar:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - run: echo "Despliegue simulado a staging"
